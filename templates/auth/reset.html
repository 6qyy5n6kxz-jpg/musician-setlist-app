{% extends "base.html" %}

{% block content %}
<h2>Change Password</h2>
<form method="post" action="{{ url_for('auth.reset_password') }}">
  <p><label>Current Password</label><br/><input name="current_password" type="password" autocomplete="current-password" required /></p>
  <p><label>New Password</label><br/><input name="password" type="password" autocomplete="new-password" minlength="8" required /></p>
  <p><label>Confirm New Password</label><br/><input name="password2" type="password" autocomplete="new-password" minlength="8" required /></p>
  <p><button class="btn" type="submit">Change Password</button></p>
</form>
{% endblock %}
